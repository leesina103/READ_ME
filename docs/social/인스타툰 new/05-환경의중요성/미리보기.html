환경과 사람들이었다.</p></details></figure></div><h2>게시물 캡션</h2><pre>혼자서는 마음을 다잡아도 잘 움직이지 못할 때가 있었다.
그런데 함께 집중하고 힘을 내는 사람들이 있는 곳에서는 조금 달랐다.

독서모임에서도 도전하는 사람들의 이야기를 들으며 나에게도 의지가 생겼다. 같이 나아갈 사람이 있다는 사실이 힘이 됐다.

내 의지만큼이나, 내가 머무는 환경과 함께하는 사람도 중요했다.
