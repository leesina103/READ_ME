펼치게 됐다</p></details></figure><figure><a href="02.png?v=5e5d3afa81" target="_blank" rel="noopener"><img src="02.png?v=5e5d3afa81" alt="쌓아두던 책을, 펼치게 됐다 2장" loading="lazy"></a><figcaption>2 / 8</figcaption><details><summary>대본 보기</summary><p class="copy">읽고 싶어서 샀다.

책도 그 자리에 그대로였다.</p></details></figure><figure><a href="03.png?v=882c06e40b" target="_blank" rel="noopener"><img src="03.png?v=882c06e40b" alt="쌓아두던 책을, 펼치게 됐다 3장" loading="lazy"></a><figcaption>3 / 8</figcaption><details><summary>대본 보기</summary><p class="copy">오늘은 피곤하니까.
주말에 읽어야지.
그러다 한 주가 지나갔다.</p></details></figure><figure><a href="04.png?v=c37ce4cefe" target="_blank" rel="noopener"><img src="04.png?v=c37ce4cefe" alt="쌓아두던 책을, 펼치게 됐다 4장" loading="lazy"></a><figcaption>4 / 8</figcaption><details><summary>대본 보기</summary><p class="copy">모임을 시작하고 나서는
