g="lazy"><figcaption>6 / 8 · 내가 연락하지 않으면…</figcaption></figure><figure><img src="07.png" alt="7장 문구 없이 시간이 흐르는 장면" loading="lazy"><figcaption>7 / 8 · 문구 없는 장면</figcaption></figure><figure><img src="08.png" alt="8장 조금씩, 놓아주기로 했다." loading="lazy"><figcaption>8 / 8 · 조금씩, 놓아주기로 했다.</figcaption></figure></div><section><h2>게시물 캡션</h2><p>아래 글은 게시물 본문용입니다.</p><textarea aria-label="복사할 게시물 캡션" readonly>학창 시절, 제일 친한 친구가 있었다.
이 친구와는 정말 평생 갈 줄 알았다.

특별히 다툰 일도 없는데 우리는 서서히 멀어졌다.
그래도 참 좋은 친구라고 생각해서, 계속 만나고 싶었다.

일 년에 한두 번쯤 내가 먼저 연락하고 약속을 잡았다.
그렇게 몇 년 동안 만남을 이어갔다.

그러다 내가 먼저 연락하지 않으니,
연락도 만남도 없어졌다.

그땐 좀 허무했다.
평생 갈 줄 알았던 사이도 이렇게 멀어지는구나.

내가 놓으면 끝나는 관계라는 걸 알면서도
쉽게 놓지는 못했다.
하지만 나 혼자 애써 이어가는 일이
나에게 좋은 건 아닌 것 같았다.

마음은 아팠지만, 조금씩 놓아주기로 했다.
우리는 여기까지의 인연이었나 보다.</textarea><p><a href="게시물-캡션.txt">캡션 텍스트 파일</a></p></section><p>휴대폰 속 짧은 메시지와 표정·장소·시간 경과는 원문 경험을 장면으로 풀어낸 각색입니다. 상대의 답장 여부나 의도를 단정하지 않았습니다.</p></main></html>
