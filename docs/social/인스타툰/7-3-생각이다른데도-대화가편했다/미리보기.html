<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각이 다른데도, 대화가 편했다</title><style>:root{--cream:#f7f3e7;--sand:#eadfc6;--sage:#9bae8f;--forest:#5b6b57;--ink:#3b3a34;--paper:#fffdf7;--muted:#716f65;--line:rgba(59,58,52,.14)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.7 'Noto Sans KR',sans-serif}main{max-width:1120px;margin:auto;padding:32px 24px}a{color:var(--forest)}h1,h2{word-break:keep-all}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{margin:0;min-width:0}img{display:block;width:100%;height:auto}figcaption{padding:10px 0}details{padding:0 0 20px}.copy,pre{white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer}a:focus-visible,summary:focus-visible{outline:2px solid var(--forest);outline-offset:4px}@media(max-width:820px){.grid{grid-template-columns:1fr}main{padding:28px 20px}}@media(max-width:430px){main{padding:20px 12px}h1{font-size:24px}.grid{gap:18px}}</style></head><body><main><h1>생각이 다른데도, 대화가 편했다</h1><p>7-3편 · 8장 · 생활감과 감정의 깊이를 담은 수정본</p><p><a href="../../전체-미리보기.html#7-3">전체 미리보기</a></p><div class="grid"><figure><a href="01.png?v=57a2fd556a" target="_blank" rel="noopener"><img src="01.png?v=57a2fd556a" alt="생각이 다른데도, 대화가 편했다 1장" loading="lazy"></a><figcaption>1 / 8</figcaption><details><summary>대본 보기</summary><p class="copy">생각이 다른데도,
대화가 편했다</p></details></figure><figure><a href="02.png?v=776f0d77da" target="_blank" rel="noopener"><img src="02.png?v=776f0d77da" alt="생각이 다른데도, 대화가 편했다 2장" loading="lazy"></a><figcaption>2 / 8</figcaption><details><summary>대본 보기</summary><p class="copy">“저는 조금 다르게 읽었어요.”
그 말을 듣자,
내가 잘못 읽었나 싶었다.</p></details></figure><figure><a href="03.png?v=0e5a0289ad" target="_blank" rel="noopener"><img src="03.png?v=0e5a0289ad" alt="생각이 다른데도, 대화가 편했다 3장" loading="lazy"></a><figcaption>3 / 8</figcaption><details><summary>대본 보기</summary><p class="copy">어디서 그렇게 느꼈는지 물어줬다.
나는 내 생각을 설명했고,
사람들은 끝까지 들었다.</p></details></figure><figure><a href="04.png?v=0288ab51ca" target="_blank" rel="noopener"><img src="04.png?v=0288ab51ca" alt="생각이 다른데도, 대화가 편했다 4장" loading="lazy"></a><figcaption>4 / 8</figcaption><details><summary>대본 보기</summary><p class="copy">같은 문장을 읽고도
우리는 서로 다른 경험을
떠올리고 있었다.</p></details></figure><figure><a href="05.png?v=3400a5e01c" target="_blank" rel="noopener"><img src="05.png?v=3400a5e01c" alt="생각이 다른데도, 대화가 편했다 5장" loading="lazy"></a><figcaption>5 / 8</figcaption><details><summary>대본 보기</summary><p class="copy">끝까지 의견이 같아지지는 않았다.
그래도 대화는 편했다.</p></details></figure><figure><a href="06.png?v=2aa860c161" target="_blank" rel="noopener"><img src="06.png?v=2aa860c161" alt="생각이 다른데도, 대화가 편했다 6장" loading="lazy"></a><figcaption>6 / 8</figcaption><details><summary>대본 보기</summary><p class="copy">내 말을 넘겨짚지 않고,
왜 그렇게 생각했는지
궁금해해 주는 게 좋았다.</p></details></figure><figure><a href="07.png?v=6048376cdc" target="_blank" rel="noopener"><img src="07.png?v=6048376cdc" alt="생각이 다른데도, 대화가 편했다 7장" loading="lazy"></a><figcaption>7 / 8</figcaption><details><summary>대본 보기</summary><p class="copy">나도 누군가에게
그런 사람이 되고 싶었다.
“조금 더 이야기해 줄래요?”</p></details></figure><figure><a href="08.png?v=fc5d56e156" target="_blank" rel="noopener"><img src="08.png?v=fc5d56e156" alt="생각이 다른데도, 대화가 편했다 8장" loading="lazy"></a><figcaption>8 / 8</figcaption><details><summary>대본 보기</summary><p class="copy">다음에도 같이 이야기하고 싶었다.
그러려면 일단,
다음 책을 펼쳐야 했다.</p></details></figure></div></main></body></html>
