생각들이 생겼다</p></details></figure><figure><a href="02.png?v=a0ba406b0b" target="_blank" rel="noopener"><img src="02.png?v=a0ba406b0b" alt="혼자였다면 못 했을 생각들이 생겼다 2장" loading="lazy"></a><figcaption>2 / 9</figcaption><details><summary>대본 보기</summary><p class="copy">혼자 골랐다면
펼쳐보지 않았을 책이었다.
질문도 낯설었다.</p></details></figure><figure><a href="03.png?v=14eb548e1e" target="_blank" rel="noopener"><img src="03.png?v=14eb548e1e" alt="혼자였다면 못 했을 생각들이 생겼다 3장" loading="lazy"></a><figcaption>3 / 9</figcaption><details><summary>대본 보기</summary><p class="copy">함께 이야기할 질문이 있었다.
“주변의 기대와 내가 원하는 것이
달랐던 적 있나요?”</p></details></figure><figure><a href="04.png?v=7c0458a609" target="_blank" rel="noopener"><img src="04.png?v=7c0458a609" alt="혼자였다면 못 했을 생각들이 생겼다 4장" loading="lazy"></a><figcaption>4 / 9</figcaption><details><summary>대본 보기</summary><p class="copy">누군가는 이직을,
누군가는 관계를,
누군가는 쉬었던 시간을 말했다.</p></details></figure><figure><a href="05.png?v=e428476731" target="_blank" rel="noopener"><img src="05.png?v=e428476731" alt="혼자였다면 못 했을 생각들이 생겼다 5장" loading="lazy"></a><figcaption>5 / 9</figcaption><details><summary>대본 보기</summary><p class="copy">그 선택을 해본 사람의 얘기를 들으니,
내가 생각한 길 말고도
다른 길이 있다는 게 실감 났다.</p></details></figure><figure><a href="06.png?v=093ff5c7e0" target="_blank" rel="noopener"><img src="06.png?v=093ff5c7e0" alt="혼자였다면 못 했을 생각들이 생겼다 6장" loading="lazy"></a><figcaption>6 / 9</figcaption><details><summary>대본 보기</summary><p class="copy">나도 발제문을 준비할 때면,
다른 사람은 어떻게 읽었을지
궁금해졌다.</p></details></figure><figure><a href="07.png?v=61ed4807c9" target="_blank" rel="noopener"><img src="07.png?v=61ed4807c9" alt="혼자였다면 못 했을 생각들이 생겼다 7장" loading="lazy"></a><figcaption>7 / 9</figcaption><details><summary>대본 보기</summary><p class="copy">비슷한 고민이 찾아온 날,
그때 들었던 얘기가 떠올랐다.
조금 더 생각해볼 수 있었다.</p></details></figure><figure><a href="08.png?v=90d1fe961c" target="_blank" rel="noopener"><img src="08.png?v=90d1fe961c" alt="혼자였다면 못 했을 생각들이 생겼다 8장" loading="lazy"></a><figcaption>8 / 9</figcaption><details><summary>대본 보기</summary><p class="copy">책에서는 살아보지 못한 삶을 만났다.
그 이야기를 빌려
내 고민도 다시 들여다봤다.</p></details></figure><figure><a href="09.png?v=e4116e6aad" target="_blank" rel="noopener"><img src="09.png?v=e4116e6aad" alt="혼자였다면 못 했을 생각들이 생겼다 9장" loading="lazy"></a><figcaption>9 / 9</figcaption><details><summary>대본 보기</summary><p class="copy">내 마음을 한 번 더 들여다보고,
다른 사람의 말을 조금 더 듣고,
미뤄둔 책을 다시 펼쳤다.
일상이 그렇게 조금씩 달라졌다.</p></details></figure></div></main></body></html>
