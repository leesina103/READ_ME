<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>READ ME 스타일 비교</title><style>:root {
  --cream: #f7f3e7; --sand: #eadfc6; --sage: #9bae8f; --forest: #5b6b57; --ink: #3b3a34;
  --paper: #fffdf7; --muted: #716f65; --line: rgba(59, 58, 52, .14);
  --error: #b42318;
  --background: var(--cream); --foreground: var(--ink); --accent: var(--sage); --accent-dark: var(--forest);
}*{box-sizing:border-box}body{background:var(--cream);color:var(--ink);font:16px/1.7 sans-serif;margin:0;padding:24px}main{max-width:1100px;margin:auto}h1,h2{color:var(--forest)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0}img{width:100%;display:block}figcaption{padding:12px 0}a{color:var(--forest)}@media(max-width:820px){body{padding:16px}.pair{gap:12px}}@media(max-width:430px){body{padding:12px}.pair{gap:8px}figcaption{font-size:12px}}</style><main><h1>같은 문장, 다른 글씨</h1><p>A는 현재 스타일, B는 Noto Serif KR 명조 제목입니다. 문구·리미·본문 배치는 유지했습니다. 1장은 배경도 초록에서 크림으로 바꿨고, 5장은 손글씨와 명조의 차이를 비교합니다.</p><h2>1장</h2><div class="pair"><figure><a href="A-01.png"><img src="A-01.png" alt="1장 A 현재 스타일"></a><figcaption>A · 현재 고딕 + 초록 표지</figcaption></figure><figure><a href="01.png"><img src="01.png" alt="1장 B 명조 제목"></a><figcaption>B · 명조 제목 + 크림 표지</figcaption></figure></div><h2>5장</h2><div class="pair"><figure><a href="A-05.png"><img src="A-05.png" alt="5장 A 현재 스타일"></a><figcaption>A · 현재 손글씨 질문</figcaption></figure><figure><a href="05.png"><img src="05.png" alt="5장 B 명조 제목"></a><figcaption>B · 명조 제목</figcaption></figure></div><h2>실천·기록은 어디에 있나요?</h2><p>현재 6장 하단의 ‘다시 일상으로 돌아가면’과 7장의 행동 예시에 들어 있습니다. ‘내 생각 / 새로 들은 관점 / 해볼 일’ 노트 디자인은 아직 적용하지 않은 제안입니다.</p><div class="pair"><figure><img src="../06.png" alt="6장 진행 방식"><figcaption>6장 · 하단에 시도와 기록 안내</figcaption></figure><figure><img src="../07.png" alt="7장 실천 예시"><figcaption>7장 · 일상에서 해볼 행동 예시</figcaption></figure></div></main>
