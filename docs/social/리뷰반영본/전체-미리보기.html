<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>READ ME 인스타툰 · 1~8편</title><style>:root{--cream:#f7f3e7;--sand:#eadfc6;--sage:#9bae8f;--forest:#5b6b57;--ink:#3b3a34;--paper:#fffdf7;--muted:#716f65;--line:rgba(59,58,52,.14)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans KR",sans-serif}main{max-width:1120px;margin:auto;padding:36px 24px}h1{font-size:30px;line-height:1.4}p{line-height:1.7;color:var(--muted)}a{color:var(--forest)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{padding:10px 16px;border:1px solid var(--line);background:var(--paper);color:var(--forest);border-radius:8px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:var(--forest);color:var(--paper)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{margin:0;background:var(--paper);border:1px solid var(--line)}img{display:block;width:100%;height:auto}figcaption{padding:12px 16px;line-height:1.6}details{padding:0 16px 16px;color:var(--muted)}summary{cursor:pointer}.copy{white-space:pre-line}.episode-links{display:flex;gap:16px;flex-wrap:wrap}@media(max-width:820px){.grid{grid-template-columns:1fr}main{padding:28px 20px}}@media(max-width:430px){main{padding:20px 12px}h1{font-size:24px}.grid{gap:18px}}</style><main><p>READ ME · 리미 인스타툰 검토본</p><h1>1~8편 리뷰 반영본</h1><p>기존 순서와 설명형 구성을 유지했습니다. <a href="../전체-미리보기.html">수정 전 비교</a> · <a href="수정내역.txt">수정 내역</a></p><nav id="nav" aria-label="편 선택"></nav><h2 id="title"></h2><p id="count"></p><p><a id="single">이 편만 열기</a></p><div class="grid" id="grid"></div><section><h2>게시물 캡션</h2><p id="caption" style="white-space:pre-line"></p></section></main><script>const episodes=[{"n":1,"slug":"01-인간관계","title":"인간관계란 무엇일까","slides":[["",""],["",""],["",""],["",""],["",""],["",""],["",""],["",""],["",""],["",""]]},{"n":2,"slug":"02-결이맞는사람","title":"결이 맞는 사람들을 만나려면 어떻게 해야 할까?","slides":[["결이 맞는 사람들을 만나려면\n어떻게 해야 할까?","제목 띄어쓰기만 수정. '해야할까?'를 '해야 할까?'로. 다른 그림과 구성 그대로."],["나이가 들면서 관계는 조금씩 좁아졌다.\n새로운 사람을 만날 기회도 드물어졌다.","혼자 출근길 걷는 리미, 배경 군중은 희미하게. 넓은 여백."],["사람은 만나고 싶었다.\n하지만 아무 모임이나 가고 싶지는 않았다.","집 책상에서 모임을 찾아보는 리미. 휴대폰 화면 글씨 없이."],["여러 모임을 가봤지만,\n비슷한 소개와 질문이 반복됐고,\n나에게는 잘 맞지 않았다.","리미 외 모든 인물 교체. 왼쪽 갈색곰을 작은 둥근귀의 회색 생쥐(짙은 샌드 재킷), 오른쪽 흰강아지를 부리 있는 올리브 오리(크림 셔츠)로 교체. 배경 동물 실루엣은 모두 없애고 빈 가구만. 곰·강아지·토끼는 없어야 함. 리미와 본문 유지."],["만남에 돈과 시간을 썼지만,\n돌아오면 오히려 지칠 때도 있었다.","밤길 천천히 집으로 돌아오는 리미. 고개 살짝 숙임, 술병 없음."],["그러다 독서모임에 들어갔다.\n서로의 생각을 존중하고,\n더 나아지고 싶어 하는 사람들이 있었다.","둥근 책모임 테이블. 리미, 갈색 곰 베이지 니트, 귀 접힌 흰 강아지 세이지 셔츠. 열린 책들과 경청."],["좋은 대화를 나누니 힘이 났다.\n그때 만난 사람들과는\n지금도 따로 만나 이야기를 나눈다.","같은 곰과 강아지와 리미가 카페에서 다시 이야기. 책과 세 컵. 편안함."],["언제 만났느냐보다,\n서로 관계를 얼마나 소중히 여기는지가\n더 중요하다는 걸 알았다.","리미가 두 동료와 산책하며 서로 바라보는 따뜻한 장면. 친구 무리 새싹 캐릭터는 리미 한명."]]},{"n":3,"slug":"03-같이나아갈사람","title":"같이 나아갈 사람들을 만나고 싶어서","slides":[["같이 나아갈 사람들을\n만나고 싶어서","표지. 리미가 넓은 원탁에 책과 컵을 준비한다. 작은 빈 의자 세개. 초대하는 온화함."],["좋은 사람들과 대화하고 나니,\n내가 어떤 만남을 원했는지 알 것 같았다.","리미가 지난 모임을 떠올리며 노트 앞에 생각. 작은 배경 원탁의 흐린 기억, 분할패널 금지."],["서로의 이야기를 존중하고,\n관계를 소중하게 여기는 사람들.","리미가 말하고 갈색 곰과 흰 강아지가 눈을 맞추며 경청. 책 테이블."],["고민도, 해보고 싶은 일도\n편하게 나누고,\n서로 응원할 수 있는 사람들.","세 친구가 작은 원탁에서 책을 펼쳐 토의. 격려하는 작은 손짓, 말풍선 없음."],["한 번의 만남으로 끝나지 않고,\n서로의 이야기를 꾸준히 나눌 수 있는\n관계였으면 했다.","본문을 지정한 새 문구로 교체. 의자를 정돈하며 모임을 설립하는 장면 대신 위에서 내려다본 책과 세 사람의 손 클로즈업: 초록후드 리미 손, 베이지니트 곰 손, 세이지셔츠 흰강아지 손이 각자의 노트를 펼침. 얼굴 없이 세 손과 책, 컵. 좋은 관계를 지속하고 싶은 뜻."],["내가 만나고 싶은 건,\n서로의 이야기를 존중하며\n같이 나아갈 사람들이었다.","본문을 지정한 새 문구로 교체. 리미는 열린 문 옆에 있고 앞의 곰·강아지는 제거. 문 밖 멀리에 새로운 사람을 상징하는 작고 부드러운 두 실루엣, 종을 알아볼 수 없게. 광고나 모집 문구 추가 금지."]]},{"n":4,"slug":"04-힘이되는사람","title":"만나고 오면 오히려 힘이 나는 사람","slides":[["만나고 오면\n오히려 힘이 나는 사람","갈색 곰 지인만 완전히 다른 회색 코끼리 지인으로 교체: 짧은 아래로 향한 코, 넓은 둥근귀, 작은 검은 눈, 얇은 둥근 안경, 무지 샌드색 가디건과 크림 티셔츠. 모든 4편 장면에서 동일한 캐릭터. 곰 흔적이나 베이지 케이블 니트 없음. 리미·본문·배치·행동은 원본 유지."],["그날은 너무 피곤했다.\n약속에 나가는 것도 귀찮았다.","리미가 소파에 축 처져 앉고 전화가 옆에. 눈물 없음."],["그래도 나가서 지인을 만났다.\n오랜만에 내 고민을 털어놓았다.","갈색 곰 지인만 완전히 다른 회색 코끼리 지인으로 교체: 짧은 아래로 향한 코, 넓은 둥근귀, 작은 검은 눈, 얇은 둥근 안경, 무지 샌드색 가디건과 크림 티셔츠. 모든 4편 장면에서 동일한 캐릭터. 곰 흔적이나 베이지 케이블 니트 없음. 리미·본문·배치·행동은 원본 유지."],["우리는 힘든 일도,\n앞으로 해보고 싶은 일도 이야기했다.","갈색 곰 지인만 완전히 다른 회색 코끼리 지인으로 교체: 짧은 아래로 향한 코, 넓은 둥근귀, 작은 검은 눈, 얇은 둥근 안경, 무지 샌드색 가디건과 크림 티셔츠. 모든 4편 장면에서 동일한 캐릭터. 곰 흔적이나 베이지 케이블 니트 없음. 리미·본문·배치·행동은 원본 유지."],["지인은 나이에 얽매이지 않고\n새로운 일을 고민하고, 도전하고 있었다.","갈색 곰 지인만 완전히 다른 회색 코끼리 지인으로 교체: 짧은 아래로 향한 코, 넓은 둥근귀, 작은 검은 눈, 얇은 둥근 안경, 무지 샌드색 가디건과 크림 티셔츠. 모든 4편 장면에서 동일한 캐릭터. 곰 흔적이나 베이지 케이블 니트 없음. 리미·본문·배치·행동은 원본 유지."],["서로의 고민을 듣고 응원하다 보니,\n어느새 마음이 가벼워졌다.","갈색 곰 지인만 완전히 다른 회색 코끼리 지인으로 교체: 짧은 아래로 향한 코, 넓은 둥근귀, 작은 검은 눈, 얇은 둥근 안경, 무지 샌드색 가디건과 크림 티셔츠. 모든 4편 장면에서 동일한 캐릭터. 곰 흔적이나 베이지 케이블 니트 없음. 리미·본문·배치·행동은 원본 유지."],["나올 땐 그렇게 피곤했는데,\n돌아갈 땐 오히려 힘이 났다.\n이런 사람들과 오래 함께하고 싶다.","저녁 귀갓길 리미 가벼운 발걸음. 건강치료 암시 없음, 조용한 미소."]]},{"n":5,"slug":"05-환경의중요성","title":"함께하는 사람이 생기니, 의지도 생겼다","slides":[["함께하는 사람이 생기니,\n의지도 생겼다","표지. 원탁에서 리미와 곰과 강아지가 각자 책노트를 펼침. 함께 집중하는 편안함."],["피곤해도 회사에 가면\n집중이 잘되는 날이 있었다.\n혼자 있을 때와는 달랐다.","회사 배경 곰을 검은 눈테 무늬 너구리(크림 와이셔츠), 흰강아지를 회색 코알라(샌드 셔츠)로 교체. 사원증 무문자. 독서모임 곰·강아지와 4편 코끼리는 등장하지 않음. 나머지 그대로."],["힘든 일도 함께 힘을 내는 사람이 있으면\n조금은 다르게 느껴졌다.","리미와 함께 자료 보는 갈색 곰을 검은 눈테 무늬 너구리(크림 와이셔츠와 무문자 사원증)로 교체. 5편2장의 회사동료와 동일. 곰·강아지·코끼리 없음. 나머지 그대로."],["독서모임에서도 그랬다.\n같은 주제라도 함께하는 사람에 따라\n대화는 달라졌다.","책모임 원탁 리미 곰 강아지 모두 참여. 손짓과 눈맞춤."],["도전하는 사람들의 이야기를 듣고,\n함께 나아갈 사람이 생기니\n나에게도 의지가 생겼다.","동료 강아지가 얘기하고 리미가 고개들어 관심갖고 듣는다. 책과 노트, 맑은 표정."],["혼자 마음만 다잡으려 했는데,\n내가 머무는 환경과\n함께하는 사람도 중요했다.","리미가 밝은 모임방 문턱을 넘어 들어가는 뒷모습. 사람들 둥근 테이블에서 기다림."]]},{"n":6,"slug":"06-직접만든이유","title":"변화가 필요해서, 직접 만들기로 했다","slides":[["변화가 필요해서,\n직접 만들기로 했다","표지. 리미가 모임 테이블 한가운데 책을 놓는 장면. 아직 빈 의자, 결심 표정."],["반복되는 일상 속에서 매너리즘에 빠졌다.\n무언가 달라져야 할 것 같았다.","본문만 지정한 새 문구로 수정. 매너리즘이 왔다 -> 매너리즘에 빠졌다. 그림 나머지 그대로."],["집도 바꿔봤다.\n그다음에는 무엇을 바꿔야 할까?","이사상자 두 개 옆 새 방의 리미. 특정 주소나 회사이름 없음."],["새로운 환경에 나를 놓으면\n다시 움직이게 되지 않을까?","리미가 창문을 열고 바깥을 바라봄. 환경을 바꾸려는 질문 장면."],["그때, 독서토의를 하며\n마음이 채워졌던 순간들이 떠올랐다.","책을 펼쳐 든 리미가 부드럽게 미소. 뒤쪽에 모임 테이블 기억처럼 따뜻한 장면 하나, 콜라주금지."],["하지만 내가 계속 참여하고 싶은 모임은\n쉽게 찾을 수 없었다.","리미가 노트와 전화 두고 고민. 앱화면 글씨·다른모임 비난 없음."],["그래서 내가 만들기로 했다.\n좋은 사람들과 대화를 이어갈 수 있는,\n나도 꾸준히 함께하고 싶은 자리를.","리미가 원탁의 마지막 의자를 놓고 준비된 책과 컵 바라봄. 새 출발. 추가광고없음."]]},{"n":7,"slug":"07-마음이채워지는대화","title":"대화를 나누면 왜 마음이 채워질까?","slides":[["대화를 나누면\n왜 마음이 채워질까?","표지. 리미가 책 위에 손 올리고 듣고있음. 맞은편 곰 부드러운 실루엣. 질문하는 표정."],["머릿속에는 생각이 많은데,\n무슨 생각인지 나도 잘 모를 때가 있었다.","책상에서 생각하는 리미, 머리 위 작고 가는 추상적 엉킨 선 한개. 글자 아닌 선."],["그런데 말을 하다 보면,\n흩어져 있던 생각이 조금씩 정리됐다.","모임 테이블에서 리미 조심스레 말함. 과장된 마법 효과 없이."],["누군가 내 이야기를 끝까지 듣고,\n한 번 더 물어봐 주었다.","본문 그대로. 하단 그림은 리미 어깨 너머에서 본, 경청하고 다시 물어보는 베이지니트 곰 얼굴 클로즈업으로 변경. 전경 한쪽 리미 책머리 가장자리와 새싹 조금, 중심 곰의 따뜻한 눈맞춤과 살짝 열린 입. 테이블 전체나 단체 정면구도 없음."],["다른 사람의 생각을 들으며\n내 생각도 다시 바라보게 됐다.","흰 강아지가 책을 펼쳐 이야기, 리미가 노트 보며 경청."],["말로 꺼내고 나니,\n내가 중요하게 여기는 것과\n가고 싶은 방향이 조금 더 선명해졌다.","본문 그대로. 하단은 리미 시점으로 내려다본 노트와 펜을 든 작은 크림 손 클로즈업. 초록후드 소매 두개. 노트에 흐린 선과 작은 체크만, 읽을 글자 없음. 주변 친구는 베이지니트 소매와 세이지셔츠 소매 일부분만 가장자리에 작게. 얼굴과 원탁 전경 없음."],["내 이야기를 나눌 수 있고,\n서로 존중하며 들어주는 시간.\n그런 대화가 나를 채워줬다.","리미 곰 강아지 모두 같은 높이 원탁에 앉아 따뜻하게 대화. 책들은 작게, 사람 중심."]]},{"n":8,"slug":"08-일상의변화","title":"독서모임 이후, 내 일상이 달라졌다","slides":[["독서모임 이후,\n내 일상이 달라졌다","표지. 리미가 집 창가 책상에서 노트를 펼치며 미소. 편안한 생활."],["한동안은 모든 게 의미 없게 느껴졌다.\n무기력하고 피곤해서,\n그냥 누워 있는 시간이 많았다.","소파 오른쪽 끝 잠든 흰강아지를 완전히 제거하고 그 부분을 기존 소파 쿠션과 담요로 자연스럽게 연결. 다른 동물로 교체하지 말 것. 리미 혼자만 등장. 본문·리미·그림체·나머지 전체 그대로."],["독서토의에 나가\n내 생각을 솔직하게 나누기 시작했다.","리미가 곰 강아지와 원탁에서 천천히 말한다. 상호존중 눈맞춤."],["오랜만에 재미있는 일을 찾은 기분이었다.\n이야기하다 보면 시간이 금방 갔다.","편안히 대화중인 리미와 두 친구. 벽시계 작은 단순 바늘, 숫자 없음."],["대화를 나누고 돌아오면\n마음이 한결 평온했다.\n나를 조금씩 되찾는 느낌이었다.","모임 후 저녁 산책길 리미 숨을 고르며 평온. 극적인 치료효과 없음."],["퇴근 후에도 무언가에 몰입할\n의지가 생기는 날들이 있었다.","저녁 집 책상 스탠드 켜고 노트에 집중하는 리미. 직업이나 프로젝트 특정 안함."],["좋은 사람들과 나눈 대화가\n그 자리에서 끝나지 않고,\n내 일상에도 힘이 되어주었다.","창가 아침 빛 속에서 가방을 챙기며 하루 시작하는 리미, 담담한 희망. 광고나 완치표현없음."]]}];const captions={"2":"새로운 사람을 만나고 싶었지만, 아무 모임이나 가고 싶지는 않았다.\n여러 자리에 나가봐도 비슷한 소개와 질문만 반복되면 오히려 지쳐 돌아오곤 했다.\n\n독서모임에서는 서로의 생각을 존중하고, 더 나아지고 싶어 하는 사람들을 만났다. 그때의 인연 중에는 지금도 따로 만나 이야기를 나누는 사람들이 있다.\n\n오래 알았다는 것보다, 지금 이 관계를 서로 얼마나 소중하게 여기는지가 더 중요했다.\n\n#README #리미 #독서모임 #인간관계 #좋은인연\n","3":"좋은 대화를 경험하고 나니, 내가 어떤 사람들과 함께하고 싶은지 조금은 알 것 같았다.\n\n내 이야기를 존중해 주고, 나도 그 사람의 이야기를 궁금해하는 관계.\n고민과 해보고 싶은 일을 편하게 나누고, 서로 응원할 수 있는 관계.\n\n한 번 만나고 끝나는 인연보다, 대화를 꾸준히 이어가며 같이 나아갈 사람들이 곁에 있었으면 했다.\n\n#README #리미 #독서모임 #관계 #함께성장\n","4":"너무 피곤해서 약속에 나가기 싫었던 날이었다.\n그래도 지인을 만나 오랜만에 내 고민을 털어놓았다.\n\n힘든 일도, 앞으로 해보고 싶은 일도 이야기했다. 나이에 얽매이지 않고 새로운 일을 고민하고 도전하는 지인의 모습에서 나도 힘을 얻었다.\n\n나갈 때는 피곤했는데, 돌아오는 길에는 마음이 가벼웠다.\n만나고 나면 오히려 에너지가 채워지는 사람. 그런 사람들과 오래 함께하고 싶다.\n\n#README #리미 #좋은사람 #대화 #응원\n","5":"혼자서는 마음을 다잡아도 잘 움직이지 못할 때가 있었다.\n그런데 함께 집중하고 힘을 내는 사람들이 있는 곳에서는 조금 달랐다.\n\n독서모임에서도 도전하는 사람들의 이야기를 들으며 나에게도 의지가 생겼다. 같이 나아갈 사람이 있다는 사실이 힘이 됐다.\n\n내 의지만큼이나, 내가 머무는 환경과 함께하는 사람도 중요했다.\n\n#README #리미 #독서모임 #환경의중요성 #함께성장\n","6":"반복되는 일상 속에서 매너리즘에 빠졌다.\n집도 바꿔보고, 나를 새로운 환경에 놓는 일을 생각했다.\n\n그때 떠오른 건 독서토의를 하며 마음이 채워졌던 순간들이었다. 하지만 내가 계속 참여하고 싶은 모임은 쉽게 찾을 수 없었다.\n\n그래서 직접 만들기로 했다.\n좋은 사람들과 대화를 이어갈 수 있고, 나도 꾸준히 함께하고 싶은 자리. READ ME는 그런 마음에서 시작됐다.\n\nREAD ME가 궁금하다면 이 계정으로 DM을 보내주세요.\n\n#README #리미 #독서모임 #모임을만든이유 #함께하는시간\n","7":"머릿속에는 생각이 많은데, 정작 무슨 생각인지 나도 잘 모를 때가 있다.\n말로 꺼내다 보면 흩어져 있던 생각이 조금씩 정리된다.\n\n누군가 끝까지 듣고 한 번 더 물어봐 주면, 혼자서는 지나쳤을 생각까지 들여다보게 된다. 다른 사람의 관점을 듣는 것도 내 생각을 다시 보는 계기가 됐다.\n\n정답을 얻어서만 좋았던 게 아니다.\n내 이야기를 꺼낼 수 있고 서로 존중하며 들어주는 시간, 그 자체가 나를 채워줬다.\n\n#README #리미 #독서토의 #경청 #생각정리\n","8":"무기력하고 피곤해서 그냥 누워 있는 시간이 많았다.\n독서토의에 나가 내 생각을 솔직하게 나누면서, 오랜만에 재미있는 일을 찾은 기분이 들었다.\n\n이야기하다 보면 시간이 금방 갔고, 돌아오면 마음이 한결 평온했다. 퇴근 후에도 무언가에 몰입할 의지가 생기는 날들이 있었다.\n\n좋은 대화는 모임에서 끝나지 않았다.\n내 일상으로 돌아와서도 힘이 되어주었다.\n\n#README #리미 #독서모임 #일상의변화 #좋은대화\n"};const nav=document.getElementById('nav');const grid=document.getElementById('grid');function show(n){const e=episodes.find(x=>x.n===n)||episodes[0];document.getElementById('title').textContent=e.n+'편 · '+e.title;document.getElementById('count').textContent='총 '+e.slides.length+'장 · 수정 의견은 편과 장 번호로 알려주세요.';document.getElementById('caption').textContent=captions[e.n]||'1편은 기존 10장 버전입니다.';grid.replaceChildren();e.slides.forEach(([copy],i)=>{const f=document.createElement('figure');const img=document.createElement('img');img.src=e.slug+'/'+String(i+1).padStart(2,'0')+'.png';img.alt=copy||e.n+'편 '+(i+1)+'장';img.loading='lazy';const cap=document.createElement('figcaption');cap.textContent=e.n+'편 · '+(i+1)+' / '+e.slides.length;f.append(img,cap);if(copy){const d=document.createElement('details');const s=document.createElement('summary');s.textContent='문구 보기';const p=document.createElement('p');p.className='copy';p.textContent=copy;d.append(s,p);f.append(d)}grid.append(f)});nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.n)===e.n)));document.getElementById('single').href=e.slug+'/미리보기.html';}episodes.forEach(e=>{const b=document.createElement('button');b.textContent=e.n+'편';b.dataset.n=e.n;b.onclick=()=>{location.hash=e.n};nav.append(b)});window.addEventListener('hashchange',()=>show(Number(location.hash.slice(1))));show(Number(location.hash.slice(1))||1);</script></html>
